name: Test Xorg input driver

on:
  push:
    paths:
      - utils/xorg-deps/xf86-input-neko/**
      - .github/workflows/xorg_driver_test.yml
  pull_request:
    paths:
      - utils/xorg-deps/xf86-input-neko/**
      - .github/workflows/xorg_driver_test.yml

permissions:
  contents: read

jobs:
  driver:
    name: Build and test driver (${{ matrix.debian }})
    runs-on: ubuntu-latest
    container: debian:${{ matrix.debian }}-slim
    strategy:
      fail-fast: false
      matrix:
        debian: [bullseye, bookworm]
    steps:
      - name: Install build and isolated Xorg dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git gcc pkgconf autoconf automake libtool make \
            xorg-dev xutils-dev xserver-xorg-core xserver-xorg-video-dummy
      - uses: actions/checkout@v4
      - name: Build the vendored driver
        working-directory: utils/xorg-deps/xf86-input-neko
        run: |
          ./autogen.sh --prefix=/usr
          ./configure
          make -j2
      - name: Test real XI2 scroll and touch events
        working-directory: utils/xorg-deps/xf86-input-neko
        run: ./tests/run-integration.sh
